{% extends "base.html" %}
{% block title %}Sign Up — Smart Notes{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-head">
      <div class="auth-logo">📝</div>
      <h2>Create your account</h2>
      <p>Start organizing your notes for free</p>
    </div>

    <form method="POST" action="{{ url_for('signup') }}" class="auth-form" novalidate>

      <div class="form-group">
        <label for="username">Username <span class="req">*</span></label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          placeholder="Choose a username"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="email">Email <span class="req">*</span></label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-input"
          placeholder="your@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password <span class="req">*</span></label>
        <div class="pw-wrap">
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="At least 6 characters"
            required
          />
          <button type="button" class="pw-toggle" onclick="togglePassword('password')">👁</button>
        </div>
        <!-- Strength meter -->
        <div class="strength-bar" id="strengthBar"></div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password <span class="req">*</span></label>
        <div class="pw-wrap">
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            class="form-input"
            placeholder="Repeat your password"
            required
          />
          <button type="button" class="pw-toggle" onclick="togglePassword('confirm_password')">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Create Account</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
