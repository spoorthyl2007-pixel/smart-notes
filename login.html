{% extends "base.html" %}
{% block title %}Log In — Smart Notes{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-head">
      <div class="auth-logo">📝</div>
      <h2>Welcome back</h2>
      <p>Sign in to your Smart Notes account</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form" novalidate>

      <div class="form-group">
        <label for="identifier">Username or Email</label>
        <input
          type="text"
          id="identifier"
          name="identifier"
          class="form-input"
          placeholder="Enter your username or email"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            required
          />
          <button type="button" class="pw-toggle" onclick="togglePassword('password')">👁</button>
        </div>
      </div>

      <label class="remember-row">
        <input type="checkbox" name="remember" />
        <span>Remember me</span>
      </label>

      <button type="submit" class="btn btn-primary btn-full">Log In</button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a href="{{ url_for('signup') }}">Sign up for free</a>
    </p>
  </div>
</div>
{% endblock %}
